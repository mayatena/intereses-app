:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Diseño: lienzo blanco, tipografía del sistema, un único azul de acento, tarjetas grises muy suaves. */
:root {
  --bg: #ffffff; --bg2: #f5f5f7; --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #a1a1a6; --line: #e5e5ea;
  --accent: #0071e3; --accent-fg: #ffffff; --accent-soft: #e6f0fc;
  --ok: #1a7f3c; --ok-soft: #e7f6ec; --bad: #c9342b; --bad-soft: #fdecea;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --bg2: #1c1c1e; --fg: #f5f5f7; --fg2: #a1a1a6; --fg3: #636366; --line: #2c2c2e;
    --accent: #2997ff; --accent-fg: #00111f; --accent-soft: #0b2a47;
    --ok: #4cd37b; --ok-soft: #10301c; --bad: #ff6b60; --bad-soft: #3a1512; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --bg2: #1c1c1e; --fg: #f5f5f7; --fg2: #a1a1a6; --fg3: #636366; --line: #2c2c2e;
  --accent: #2997ff; --accent-fg: #00111f; --accent-soft: #0b2a47;
  --ok: #4cd37b; --ok-soft: #10301c; --bad: #ff6b60; --bad-soft: #3a1512; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.47 var(--font); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-block: 8px 72px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
svg.i { width: 1em; height: 1em; flex: none; }

/* cabecera */
.top { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 0; min-height: 44px; }
.top .chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--bg2); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; border: 0; }
.chip svg { color: var(--accent); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bg2); display: grid; place-items: center; cursor: pointer; font-size: 18px; color: var(--fg2); }
h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.025em; margin: 6px 0 2px; font-weight: 700; }
.lead { color: var(--fg2); margin: 0 0 4px; font-size: 17px; }

/* botones */
.btn { appearance: none; border: 0; border-radius: 14px; padding: 13px 20px; font: 600 17px var(--font); background: var(--accent); color: var(--accent-fg); cursor: pointer; min-height: 50px; width: 100%; transition: transform .12s, opacity .15s; }
.btn:active { transform: scale(0.98); }
.btn.sec { background: var(--bg2); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { width: auto; min-height: 40px; padding: 8px 18px; font-size: 15px; }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.bad { background: var(--bad); color: #fff; }
.stack { display: grid; gap: 10px; }

/* tarjeta de hoy */
.hero { background: var(--bg2); border-radius: 22px; padding: 20px; margin: 18px 0 4px; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.hero h2 { font-size: 20px; margin: 0; letter-spacing: -0.015em; }
.hero p { margin: 2px 0 0; color: var(--fg2); font-size: 15px; }

/* camino */
.island { margin: 30px 0 6px; }
.island h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg2); font-weight: 600; margin: 0 0 2px; }
.path { position: relative; width: 300px; max-width: 100%; margin: 0 auto; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; transform: translateX(var(--dx, 0px)); }
.nb { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--bg2); color: var(--fg3); font-size: 30px; transition: transform .15s; }
.nb:active { transform: scale(0.94); }
.nb.open { background: var(--accent); color: var(--accent-fg); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 38%, transparent); animation: breathe 2.6s ease-in-out infinite; }
.nb.done { background: var(--accent-soft); color: var(--accent); }
.nl { margin-top: 8px; font-weight: 600; font-size: 15px; line-height: 1.25; max-width: 190px; }
.ns { font-size: 13px; color: var(--fg2); line-height: 1.3; max-width: 190px; }
.node.locked .nl, .node.locked .ns { color: var(--fg3); }
.dots { display: flex; gap: 4px; justify-content: center; margin-top: 6px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.due { font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 4px; }
.link { display: block; width: 100%; height: 42px; margin-top: 8px; overflow: visible; }
.link path { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.link.done path { stroke: var(--accent); opacity: 0.45; }
@keyframes breathe { 50% { box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 55%, transparent); } }

/* hoja inferior y avisos */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38); z-index: 40; opacity: 0; transition: opacity .2s; }
.backdrop.in { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 26px 26px 0 0; z-index: 41;
  padding: 10px max(20px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); max-height: 88%; overflow: auto; }
.sheet.in { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 2px; }
.sheet .sub { color: var(--fg2); margin: 0 0 16px; }
.sheet h4 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); margin: 20px 0 6px; }
.sheet ul { margin: 0; padding-left: 20px; } .sheet li { margin: 4px 0; font-size: 15px; }
code, .code { font-family: var(--mono); font-size: 0.88em; background: var(--bg2); padding: 1px 6px; border-radius: 6px; }

/* sesión */
.session { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.s-top { padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.s-in { width: 100%; max-width: 560px; margin: 0 auto; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.s-count { font-size: 14px; font-weight: 600; color: var(--fg2); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.s-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }
.s-foot { padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); }
.pdots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 0; }
.pdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.pdots i.on { background: var(--accent); }

.tpage h3 { font-size: 30px; line-height: 1.12; letter-spacing: -0.022em; margin: 14px 0 12px; text-wrap: balance; }
.tpage p { margin: 0 0 12px; max-width: 62ch; }
.tpage ol { padding-left: 22px; margin: 0 0 12px; } .tpage ol li { margin: 6px 0; }
.fxs { display: grid; gap: 10px; margin: 14px 0; }
.fx { background: var(--bg2); border-radius: 16px; padding: 14px 12px; overflow-x: auto; text-align: center; font-size: 1.05em; }
.ex { border: 1.5px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 14px; }
.ex .tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.ex .st { margin: 10px 0 0; font-size: 16px; }

.prompt { color: var(--fg2); font-size: 16px; margin: 10px 0 0; }
.q { background: var(--bg2); border-radius: 22px; padding: 22px 12px; margin: 12px 0 16px; text-align: center; font-size: 1.28em; overflow-x: auto; min-height: 90px; display: flex; align-items: center; justify-content: center; }
.q mjx-container { margin: 0 !important; }
.field { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 16px; padding: 4px 14px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field.bad { border-color: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
.field.good { border-color: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.field label { font-weight: 600; color: var(--fg2); white-space: nowrap; font-size: 16px; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: 500 19px var(--mono); padding: 12px 0; }
.pv { min-height: 46px; color: var(--fg2); font-size: 15px; padding: 8px 4px 2px; overflow-x: auto; display: flex; align-items: center; gap: 8px; }
.pv .lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); flex: none; }
.pv.err { color: var(--fg3); }
.keys { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 10px; scrollbar-width: none; }
.keys::-webkit-scrollbar { display: none; }
.keys button { flex: 0 0 auto; min-width: 46px; height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--bg2); font: 600 16px var(--font); cursor: pointer; }
.keys button:active { background: var(--line); }

.fb { border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; font-size: 16px; animation: rise .22s ease-out; }
.fb b { display: block; font-size: 18px; margin-bottom: 2px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb .hintbtn { margin-top: 8px; }
.sol { background: var(--bg2); border-radius: 18px; padding: 14px 16px; margin: 10px 0 0; font-size: 16px; color: var(--fg); }
.sol p { margin: 0 0 8px; } .sol .fin { background: var(--bg); border-radius: 12px; padding: 10px; text-align: center; overflow-x: auto; margin-top: 8px; }
.hint { background: var(--accent-soft); color: var(--fg); border-radius: 14px; padding: 10px 14px; margin-top: 10px; font-size: 15px; }

.done-screen { text-align: center; padding: 28px 4px 8px; }
.done-screen .big { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 44px; background: var(--accent-soft); color: var(--accent); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
.done-screen .big.warn { background: var(--bg2); color: var(--fg2); }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } }
.done-screen h2 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0 8px; }
.stat { background: var(--bg2); border-radius: 18px; padding: 14px 6px; }
.stat b { display: block; font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--fg2); }
.mj-wait { visibility: hidden; }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { margin: 0.4em 0 !important; overflow-x: auto; overflow-y: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 380px) { h1 { font-size: 30px; } .tpage h3 { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.prompt p { margin: 0; }
.hint p { margin: 0; }

/* selector de asignatura */
.seg { display: flex; gap: 2px; padding: 2px; margin: 14px 0 4px; background: var(--bg2); border-radius: 11px; }
.seg button { flex: 1; position: relative; border: 0; background: transparent; color: var(--fg2); font: 600 15px var(--font); padding: 8px 10px; border-radius: 9px; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.04); }
.seg .dot { position: absolute; top: 6px; right: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent, #ff9f0a); }
/* enunciados de geometría */
.prompt.geo { color: var(--fg); font-size: 18px; line-height: 1.5; }
.prompt.geo code { font-size: .92em; }
.q.geo { font-size: 1.05em; justify-content: safe center; }
.fx, .ex .fx { overflow-x: auto; max-width: 100%; }

</style>

/* Teoría de cada tema, en páginas cortas. $...$ = fórmula en línea; fx = fórmulas destacadas. */
(function (root) {
'use strict';
const R = String.raw;
root.Theory = {

deriv: [
  { h: 'Integrar es deshacer una derivada', body: R`Si derivas $x^{3}$ obtienes $3x^{2}$. Integrar es el camino de vuelta: dada $3x^{2}$, buscar la función que al derivarla da $3x^{2}$.
Por eso conviene tener frescas las derivadas antes de empezar.` },
  { h: 'Derivadas básicas', fx: [
    R`(x^{n})'=n\,x^{n-1}`, R`(e^{x})'=e^{x}`, R`(\ln x)'=\frac{1}{x}`, R`(\operatorname{sen}x)'=\cos x`,
    R`(\cos x)'=-\operatorname{sen}x`, R`(\operatorname{tg}x)'=\frac{1}{\cos^{2}x}`, R`(\operatorname{arctg}x)'=\frac{1}{1+x^{2}}`] },
  { h: 'Regla de la cadena', body: R`Si hay una función dentro de otra, se deriva la de fuera y se multiplica por la derivada de la de dentro.`,
    fx: [R`\left[f(g(x))\right]'=f'(g(x))\cdot g'(x)`],
    ex: { q: R`f(x)=e^{x^{2}}`, steps: [R`Fuera: $e^{u}$, que se deriva en $e^{u}$. Dentro: $u=x^{2}$, que se deriva en $2x$.`, R`Resultado: $f'(x)=2x\,e^{x^{2}}$.`] } },
  { h: 'Producto y cociente', fx: [R`(uv)'=u'v+uv'`, R`\left(\frac{u}{v}\right)'=\frac{u'v-uv'}{v^{2}}`],

pot: [

En los ejercicios no hace falta que escribas $+C$.`, fx: [R`\int f(x)\,dx=F(x)+C`] },
  { h: 'La regla de las potencias', body: R`Se suma 1 al exponente y se divide entre el exponente nuevo. Las constantes salen fuera de la integral y las sumas se integran término a término.`,

    ex: { q: R`\int\left(6x^{2}+4x-5\right)dx`, steps: [R`Término a término: $\int6x^{2}dx=2x^{3}$, $\int4x\,dx=2x^{2}$ y $\int5\,dx=5x$.`, R`Resultado: $2x^{3}+2x^{2}-5x+C$.`] } },
  { h: 'Raíces y fracciones', body: R`Antes de integrar, reescribe todo como potencias de $x$: $\sqrt{x}=x^{1/2}$ y $\frac{1}{x^{n}}=x^{-n}$.`,
    ex: { q: R`\int\left(\sqrt{x}+\frac{3}{x^{2}}\right)dx`, steps: [R`Reescribimos: $x^{1/2}+3x^{-2}$.`,
      R`$\int x^{1/2}dx=\frac{2}{3}x^{3/2}$ y $\int3x^{-2}dx=3\cdot\frac{x^{-1}}{-1}=-\frac{3}{x}$.`, R`Resultado: $\frac{2}{3}x^{3/2}-\frac{3}{x}+C$.`] } },
  { h: 'Un caso aparte', body: R`La regla falla con $n=-1$, es decir, con $\frac{1}{x}$ (saldría una división entre 0). Su primitiva es un logaritmo, y la verás en el siguiente tema.` },

elem: [
  { h: 'Tabla de integrales inmediatas', fx: [

  { h: 'Comprueba derivando', body: R`Es la mejor costumbre: derivar tu resultado tiene que devolver lo que había dentro de la integral. Fíjate sobre todo en el signo de $\int\operatorname{sen}x\,dx$.`,
    ex: { q: R`\int\left(3\operatorname{sen}x-\frac{2}{x}\right)dx`, steps: [R`$3\int\operatorname{sen}x\,dx=-3\cos x$ y $2\int\frac{1}{x}dx=2\ln|x|$.`, R`Resultado: $-3\cos x-2\ln|x|+C$.`] } },
],

lin: [
  { h: 'Cuando dentro hay ax+b', body: R`Si conoces $\int f(u)\,du=F(u)$, entonces integrar $f(ax+b)$ es igual, pero dividiendo entre la derivada de lo de dentro, que es $a$.`,

  { h: 'Ejemplos', fx: [R`\int e^{3x+1}dx=\frac{1}{3}e^{3x+1}+C`, R`\int\cos(2x)\,dx=\frac{1}{2}\operatorname{sen}(2x)+C`,
    R`\int(2x+1)^{4}dx=\frac{(2x+1)^{5}}{2\cdot5}+C`, R`\int\frac{1}{5x-2}dx=\frac{1}{5}\ln|5x-2|+C`] },
  { h: 'Un ejemplo completo', ex: { q: R`\int\operatorname{sen}(4x-1)\,dx`, steps: [R`Fuera: $\int\operatorname{sen}u\,du=-\cos u$. Dentro: $u=4x-1$, con derivada $4$.`, R`Resultado: $-\frac{1}{4}\cos(4x-1)+C$.`] },
    body: R`El error típico es olvidar el factor $\frac{1}{a}$. La app te avisa cuando tu resultado sale multiplicado por una constante.` },
],

sust: [
  { h: 'La idea', body: R`Cuando una parte de la integral es (casi) la derivada de otra parte, se cambia de variable: $u=g(x)$ y $du=g'(x)\,dx$.`,

  { h: 'Los pasos', body: R`1. Elige $u$: lo que hay dentro de una potencia, de un exponente o en un denominador.
2. Calcula $du$.
3. Reescribe toda la integral en $u$.

5. Deshaz el cambio.` },
  { h: 'Un ejemplo', ex: { q: R`\int2x\left(x^{2}+1\right)^{3}dx`, steps: [R`Tomamos $u=x^{2}+1$, luego $du=2x\,dx$.`, R`La integral queda $\int u^{3}du=\frac{u^{4}}{4}$.`, R`Deshacemos el cambio: $\frac{\left(x^{2}+1\right)^{4}}{4}+C$.`] } },

  { h: 'Patrones frecuentes', body: R`Si reconoces uno, la integral se resuelve de memoria.`, fx: [

partes: [
  { h: 'La fórmula', body: R`Sale de la derivada de un producto. Sirve para integrales que son producto de dos funciones de tipo distinto, cuando una se simplifica al derivarla.`,

  { h: 'Regla ALPES', body: R`Toma como $u$ la primera que aparezca en este orden y deja el resto como $dv$:

  { h: 'Un ejemplo', ex: { q: R`\int x\,e^{x}dx`, steps: [R`$u=x\Rightarrow du=dx$ y $dv=e^{x}dx\Rightarrow v=e^{x}$.`, R`$\int x\,e^{x}dx=x\,e^{x}-\int e^{x}dx=x\,e^{x}-e^{x}$.`, R`Resultado: $(x-1)\,e^{x}+C$.`] } },

  { h: 'Tres trucos', body: R`Para $\int\ln x\,dx$ escribe $\ln x\cdot1$ y toma $u=\ln x$.

],

racio: [
  { h: 'Funciones racionales', body: R`Son cocientes de polinomios. Si el grado del numerador es **mayor o igual** que el del denominador, se divide primero. Después se integra según cómo sea el denominador.` },
  { h: 'Raíces distintas', body: R`Se descompone en fracciones simples. Para hallar $A$ y $B$, da a $x$ el valor de cada raíz. Cada fracción se integra a un logaritmo.`,

  { h: 'Denominador sin raíces reales', body: R`Un denominador como $x^{2}+4$ no se factoriza: la primitiva es una arcotangente.`,

barrow: [

  { h: 'Propiedades', body: R`Si cambias los límites, cambia el signo. Y puedes partir el intervalo por donde quieras.`,

areas: [
  { h: 'Área bajo una curva', body: R`Si la función es positiva en el intervalo, el área es la integral.`, fx: [R`A=\int_{a}^{b}f(x)\,dx\qquad(f\ge0)`] },

};

/* Teoría de Geometría (vectores, rectas y planos), en páginas cortas. */
(function (root) {

const R = String.raw;
root.Theory = root.Theory || {};
Object.assign(root.Theory, {

gvec: [
  { h: 'Vectores en el espacio', body: R`Un vector $\vec u=(u_1,u_2,u_3)$ tiene tres componentes. El vector que va del punto $A$ al punto $B$ se obtiene restando: **extremo menos origen**.`,
    fx: [R`\vec{AB}=B-A=(b_1-a_1,\ b_2-a_2,\ b_3-a_3)`, R`M=\frac{A+B}{2}\quad\text{(punto medio)}`],
    ex: { q: R`A(1,2,3),\quad B(4,0,5)`, steps: [R`$\vec{AB}=(4-1,\ 0-2,\ 5-3)=(3,-2,2)$.`, R`Punto medio: $M=\left(\frac{5}{2},\,1,\,4\right)$.`] } },
  { h: 'Módulo y vector unitario', body: R`El módulo es la longitud del vector. Dividir un vector entre su módulo da un vector **unitario** (de módulo 1) con la misma dirección y sentido.`,

  { h: 'Producto escalar', body: R`El producto escalar de dos vectores es un **número**. Sirve para medir ángulos y detectar perpendicularidad: dos vectores son perpendiculares si y solo si su producto escalar es $0$.`,
    fx: [R`\vec u\cdot\vec v=u_1v_1+u_2v_2+u_3v_3`, R`\cos\alpha=\frac{\vec u\cdot\vec v}{|\vec u|\,|\vec v|}`, R`\vec u\perp\vec v\iff\vec u\cdot\vec v=0`],
    ex: { q: R`\vec u=(1,2,0),\quad\vec v=(2,-1,3)`, steps: [R`$\vec u\cdot\vec v=2-2+0=0$: **son perpendiculares**.`] } },
  { h: 'Cómo escribir vectores y puntos', body: R`En los ejercicios cuyo resultado es un vector o un punto, escribe las tres componentes entre paréntesis y separadas por comas: «(1, -2, 3)».
Las fracciones se escriben con barra: «(1/2, 0, -3/4)». Los decimales, con punto («0.5»), porque la coma separa componentes.

gprod: [
  { h: 'Producto vectorial', body: R`El producto vectorial de dos vectores es otro **vector**, perpendicular a los dos. Se calcula con un determinante. Al cambiar el orden, el resultado cambia de signo: $\vec v\times\vec u=-\,\vec u\times\vec v$.`,

  { h: 'Áreas', body: R`El módulo del producto vectorial es el área del paralelogramo que forman los dos vectores. El triángulo es la mitad.`,

  { h: 'Producto mixto y volúmenes', body: R`El producto mixto de tres vectores es el determinante de sus componentes. En valor absoluto da el volumen del paralelepípedo; el tetraedro es la sexta parte. Si vale $0$, los tres vectores son **coplanarios**.`,

const curIdx = (sj = tab()) => T.findIndex((t, i) => sOf(i) === sj && !isDone(i) && unlocked(i));
const dueIdx = (sj = tab()) => T.map((t, i) => i).filter((i) => sOf(i) === sj && isDone(i) && (nd(T[i].id).due || '') <= today());
const streakNow = () => { const s = st().streak; return (s.last === today() || s.last === addDays(today(), -1)) ? s.n : 0; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];

/* ---------- hoja inferior ---------- */
function sheet(html) {
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(bd, sh);
  requestAnimationFrame(() => { bd.classList.add('in'); sh.classList.add('in'); });
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const close = () => { bd.classList.remove('in'); sh.classList.remove('in'); document.removeEventListener('keydown', onKey); setTimeout(() => { bd.remove(); sh.remove(); }, 300); };
  document.addEventListener('keydown', onKey); bd.onclick = close;

/* ---------- inicio ---------- */
let firstRender = true;
function home() {
  const app = $('#app'), y = window.scrollY;
  const sj = tab(), SJ = SUBJ.find((x) => x.id === sj), L = T.map((t, i) => i).filter((i) => sOf(i) === sj);
  const due = dueIdx(), cur = curIdx(), done = L.filter(isDone).length;
  let hero;
  if (due.length) hero = { t: 'Repaso de hoy', p: due.length + (due.length === 1 ? ' tema para refrescar' : ' temas para refrescar'), b: 'Repasar', a: 'review' };
  else if (cur >= 0) hero = { t: done ? 'Sigue donde lo dejaste' : 'Empieza aquí', p: T[cur].title, b: done ? 'Continuar' : 'Empezar', a: 'cur' };
  else hero = { t: 'Camino completado', p: 'Practica cuando quieras para no perder nivel.' };

  let html = `<div class="top"><div class="chips"><span class="chip">${I.flame}<span>${streakNow()} ${streakNow() === 1 ? 'día' : 'días'}</span></span><span class="chip">${I.bolt}<span>${st().xp} XP</span></span></div>
    <button class="iconbtn" id="bset" aria-label="Ajustes">${I.gear}</button></div>
    <div class="seg" role="tablist" aria-label="Asignatura">${SUBJ.map((x) => `<button role="tab" class="${x.id === sj ? 'on' : ''}" aria-selected="${x.id === sj}" data-s="${x.id}">${x.name}${x.id !== sj && dueIdx(x.id).length ? '<i class="dot" title="Tienes repasos pendientes"></i>' : ''}</button>`).join('')}</div>
    <h1>${SJ.name}</h1><p class="lead">${SJ.lead}</p>
    <div class="hero"><div class="grow"><h2>${esc(hero.t)}</h2><p>${esc(hero.p)}</p></div>${hero.b ? `<button class="btn sm" id="hbtn" style="flex:none">${hero.b}</button>` : ''}</div>`;
  let last = null;
  L.forEach((i, j) => {
    const t = T[i];

    }
    const s = isDone(i) ? 'done' : unlocked(i) ? 'open' : 'locked', n = nd(t.id);
    const dots = s === 'done' ? '<div class="dots" title="Nivel de dominio">' + [0, 1, 2, 3, 4].map((k) => `<i class="${k < (n.box || 0) ? 'on' : ''}"></i>`).join('') + '</div>' : '';
    html += `<div class="node ${s}" style="--dx:${DX[j % 4]}px"><button class="nb ${s}" data-i="${i}" aria-label="${esc(t.title)}${s === 'locked' ? ', bloqueado' : ''}">${s === 'done' ? I.check : s === 'open' ? I.play : I.lock}</button>
      <div class="nl">${esc(t.title)}</div><div class="ns">${esc(t.sub)}</div>${dots}${due.includes(i) ? '<div class="due">Repasar hoy</div>' : ''}</div>`;
  });
  html += '</div></section>';

  app.querySelectorAll('.nb').forEach((b) => { b.onclick = () => nodeSheet(+b.dataset.i); });
  $('#bset').onclick = settings;
  app.querySelectorAll('.seg button').forEach((b) => { b.onclick = () => { if (b.dataset.s === sj) return; st().tab = b.dataset.s; save(); firstRender = true; window.scrollTo(0, 0); home(); }; });
  const hb = $('#hbtn');

  if (firstRender) {

    if (o && L.indexOf(cur) > 2) window.scrollTo(0, window.scrollY + o.getBoundingClientRect().top - window.innerHeight / 2);

function nodeSheet(i) {
  const t = T[i], s = isDone(i) ? 'done' : unlocked(i) ? 'open' : 'locked', n = nd(t.id);
  let body = `<h3>${esc(t.title)}</h3><p class="sub">${esc(t.sub)}${s === 'done' && n.best != null ? ' · Mejor resultado: ' + Math.round(n.best * 100) + ' %' : ''}</p><div class="stack">`;
  if (s === 'locked') body += `<p class="sub" style="margin:0">Completa «${esc(T[prevIdx(i)].title)}» para desbloquearlo. Si ya lo dominas, salta con un test de 5 ejercicios sin fallar ninguno.</p>
    <button class="btn" data-a="test">Hacer el test</button><button class="btn sec" data-a="theory">Ver teoría</button>`;
  else if (s === 'open') body += '<button class="btn" data-a="lesson">Empezar lección</button><button class="btn sec" data-a="theory">Ver teoría</button>';
  else body += '<button class="btn" data-a="practice">Practicar</button><button class="btn sec" data-a="theory">Ver teoría</button>';

    };

}

function settings() {
  const sh = sheet(`<h3>Ajustes y ayuda</h3><p class="sub">Todo se guarda en este dispositivo.</p>
    <h4>Cómo escribir las respuestas</h4><ul>

    <h4>Geometría</h4><ul>

      <li>Rectas: vectorial «(x,y,z) = (1,0,2) + λ(1,1,0)», paramétricas separadas por «;», continua o implícita. Si el ejercicio pide una forma, la app lo indica.</li>
      <li>Distancias y ángulos: valor exacto («sqrt(14)/7») o un decimal bien redondeado; los ángulos, en grados.</li></ul>

  const rs = $('#rs', sh.el);

}

/* ---------- sesión ---------- */
const KEYS = [
  { l: 'x', t: 'x', nn: 1 }, { l: 'xⁿ', t: '^' }, { l: 'x²', t: '^2', nn: 1 }, { l: '( )', t: '()', b: 1 }, { l: '÷', t: '/' },
  { l: '√', t: 'sqrt()', b: 1 }, { l: 'eˣ', t: 'e^()', b: 1 }, { l: 'ln', t: 'ln()', b: 1 }, { l: 'sen', t: 'sen()', b: 1 }, { l: 'cos', t: 'cos()', b: 1 },
  { l: 'tg', t: 'tg()', b: 1 }, { l: 'arctg', t: 'arctg()', b: 1 }, { l: '|x|', t: 'abs()', b: 1, nn: 1 }, { l: 'π', t: 'pi' }, { l: 'e', t: 'e' },
  { l: '+', t: '+' }, { l: '−', t: '-' }, { l: '·', t: '*' }, { l: '⌫', t: 'BS' },
];
const GK = (l, t, b) => ({ l, t, b });
const GKEYS = {
  vec: [GK('( )', '()', 1), GK(',', ','), GK('−', '-'), GK('/', '/'), GK('√', 'sqrt()', 1), GK('π', 'pi'), GK('⌫', 'BS')],
  plane: [GK('x', 'x'), GK('y', 'y'), GK('z', 'z'), GK('=', '='), GK('+', '+'), GK('−', '-'), GK('·', '*'), GK('( )', '()', 1), GK('/', '/'), GK('⌫', 'BS')],
  line: [GK('x', 'x'), GK('y', 'y'), GK('z', 'z'), GK('λ', 'λ'), GK('=', '='), GK('( )', '()', 1), GK(',', ','), GK(';', '; '), GK('+', '+'), GK('−', '-'), GK('/', '/'), GK('⌫', 'BS')],
  gnum: [GK('√', 'sqrt()', 1), GK('( )', '()', 1), GK('/', '/'), GK('π', 'pi'), GK('+', '+'), GK('−', '-'), GK('·', '*'), GK('⌫', 'BS')],
};
function ansTex(ex) {
  if (ex.ansTex) return ex.ansTex;
  if (ex.kind === 'anti') return 'F(x)=' + E.LATEX(ex.sol) + '+C';
  if (ex.kind === 'func') return "f'(x)=" + E.LATEX(ex.f);
  const v = E.fn(ex.value)(0), ex0 = E.LATEX(ex.value);
  return ex0 + (Number.isInteger(v) || /^-?\d+$/.test(ex.value) ? '' : '\\approx ' + String(+v.toFixed(4)).replace('.', '{,}'));
}

function run(cfg) {
  const S = { mode: cfg.mode, ids: cfg.ids, tid: cfg.ids[0], phase: cfg.mode === 'theory' || cfg.theory ? 'theory' : 'ask', tp: 0,
    N: cfg.mode === 'review' ? 6 : cfg.mode === 'test' ? 5 : 8, queue: [], resolved: 0, correct: 0, first: 0, xp: 0, per: {}, extras: 0, cur: null, att: 0, fail: false, locked: false };
  if (cfg.mode === 'review') for (let k = 0; k < S.N; k++) S.queue.push({ id: S.ids[k % S.ids.length], d: 0.25 + Math.random() * 0.65 });
  else if (cfg.mode !== 'theory') for (let k = 0; k < S.N; k++) S.queue.push({ id: S.tid, d: cfg.mode === 'test' ? 0.3 + 0.7 * k / (S.N - 1) : k / (S.N - 1) });

  const el = document.createElement('div'); el.className = 'session'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="s-top"><div class="s-in row"><button class="iconbtn" id="sx" aria-label="Cerrar">${I.close}</button><div class="bar"><i id="sbar"></i></div><span class="s-count" id="scnt"></span></div></div>
    <div class="s-body" id="sbody"><div class="s-in" id="sin"></div></div><div class="s-foot"><div class="s-in" id="sfoot"></div></div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  const body = $('#sin', el), foot = $('#sfoot', el), bar = $('#sbar', el), cnt = $('#scnt', el), scroller = $('#sbody', el), barBox = $('.bar', el);
  const vv = window.visualViewport;
  const fit = () => { el.style.top = vv.offsetTop + 'px'; el.style.height = vv.height + 'px'; el.style.bottom = 'auto'; };
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit(); }
  const close = () => { if (vv) { vv.removeEventListener('resize', fit); vv.removeEventListener('scroll', fit); } el.remove(); document.body.style.overflow = ''; home(); };
  $('#sx', el).onclick = () => {
    if (S.phase !== 'ask' || (S.resolved === 0 && S.att === 0)) return close();
    const sh = sheet('<h3>¿Salir de la sesión?</h3><p class="sub">Se perderá el avance de esta sesión.</p><div class="stack"><button class="btn" id="keep">Seguir</button><button class="btn sec" id="leave">Salir</button></div>');
    $('#keep', sh.el).onclick = sh.close; $('#leave', sh.el).onclick = () => { sh.close(); close(); };
  };
  const setBar = () => { const tot = S.N + S.extras; bar.style.width = (100 * S.resolved / tot) + '%'; cnt.textContent = Math.min(S.resolved, tot) + '/' + tot; };

  /* teoría */
  function theory() {
    const pages = TH[S.tid] || [], p = pages[S.tp];
    if (!p) { S.phase = 'ask'; return ask(); }
    barBox.style.visibility = 'hidden'; cnt.textContent = (S.tp + 1) + '/' + pages.length;
    const last = S.tp === pages.length - 1;
    body.innerHTML = `<div class="tpage"><h3>${esc(p.h)}</h3>${p.body ? rich(p.body) : ''}${p.fx ? '<div class="fxs">' + p.fx.map((f) => `<div class="fx">$$${f}$$</div>`).join('') + '</div>' : ''}
      ${p.ex ? `<div class="ex"><div class="tag">Ejemplo</div><div class="fx" style="background:none;padding:6px 0">$$${p.ex.q.includes('\\qquad') ? '\\begin{array}{l}' + p.ex.q.split('\\qquad').map((x) => x.trim()).join('\\\\[6pt]') + '\\end{array}' : p.ex.q}$$</div>${p.ex.steps.map((s) => `<div class="st">${rich(s).replace(/^<p>|<\/p>$/g, '')}</div>`).join('')}</div>` : ''}</div>
      <div class="pdots">${pages.map((_, k) => `<i class="${k <= S.tp ? 'on' : ''}"></i>`).join('')}</div>`;
    typeset(body); scroller.scrollTop = 0;
    foot.innerHTML = `<div class="row">${S.tp > 0 ? '<button class="btn sec" id="back" style="width:auto;padding-inline:22px">Atrás</button>' : ''}<button class="btn grow" id="nx">${last ? (S.mode === 'theory' ? 'Listo' : 'Empezar ejercicios') : 'Siguiente'}</button></div>`;
    const bk = $('#back', el); if (bk) bk.onclick = () => { S.tp--; theory(); };
    $('#nx', el).onclick = () => { if (!last) { S.tp++; theory(); } else if (S.mode === 'theory') close(); else { S.phase = 'ask'; barBox.style.visibility = ''; ask(); } };
  }

  /* ejercicio */
  function ask() {
    if (!S.queue.length) return finish();
    const d = S.queue.shift(), topic = T.find((t) => t.id === d.id); let ex;
    try { ex = topic.gen(d.d); } catch (e) { return ask(); }
    S.cur = ex; S.curTopic = topic.id; S.att = 0; S.locked = false; barBox.style.visibility = ''; setBar();
    body.innerHTML = `<div class="prompt${ex.geo ? ' geo' : ''}">${rich(ex.prompt)}</div><div class="q${ex.geo ? ' geo' : ''}" id="qbox"></div>
      <div class="field" id="fld"><label for="ans">${esc(ex.label)}</label><input id="ans" type="text"${ex.ph ? ' placeholder="' + esc(ex.ph) + '"' : ''} inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Tu respuesta"></div>
      <div class="pv" id="pv"><span class="lbl">Vista previa</span></div><div class="keys" id="keys" role="group" aria-label="Teclado matemático"></div><div id="fbbox" aria-live="polite"></div>`;
    if (ex.geo) typeset($('.prompt', el));
    if (ex.qtex) texInto($('#qbox', el), ex.qtex, true); else $('#qbox', el).hidden = true;
    const input = $('#ans', el), fld = $('#fld', el), fb = $('#fbbox', el), pv = $('#pv', el), keys = $('#keys', el);
    scroller.scrollTop = 0;
    (ex.geo ? GKEYS[ex.keys] || GKEYS.gnum : KEYS.filter((k) => !(ex.kind === 'num' && k.nn))).forEach((k) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = k.l; b.setAttribute('aria-label', k.l);
      b.addEventListener('pointerdown', (e) => e.preventDefault());
      b.onclick = () => {
        const a = input.selectionStart, z = input.selectionEnd; input.focus({ preventScroll: true });
        if (k.t === 'BS') { const s = a === z ? Math.max(0, a - 1) : a; input.value = input.value.slice(0, s) + input.value.slice(z); input.setSelectionRange(s, s); }
        else { input.value = input.value.slice(0, a) + k.t + input.value.slice(z); const p = a + k.t.length - (k.b ? 1 : 0); input.setSelectionRange(p, p); }
        upd();
      };
      keys.appendChild(b);
    });
    foot.innerHTML = '<button class="btn" id="chk" disabled>Comprobar</button>';
    const chk = $('#chk', el); let pt;
    function upd() {
      chk.disabled = !input.value.trim() || S.locked; clearTimeout(pt);
      pt = setTimeout(() => {
        const v = input.value; if (!v.trim()) { pv.className = 'pv'; pv.innerHTML = '<span class="lbl">Vista previa</span>'; return; }
        const r = E.preview(v, ex);
        if (r.ok) { pv.className = 'pv'; pv.innerHTML = '<span class="lbl">Se lee</span><span id="pvx"></span>'; texInto($('#pvx', el), r.tex); }
        else { pv.className = 'pv err'; pv.textContent = r.msg; }
      }, 90);
    }
    input.oninput = upd;
    input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); if (S.locked) next(); else if (!chk.disabled) check(); } };
    chk.onclick = () => (S.locked ? next() : check());
    const solBlock = () => { const id = 'fin' + Math.random().toString(36).slice(2, 7); return { id, html: `<div class="sol">${rich(S.cur.steps.join('\n'))}<div class="fin" id="${id}"></div></div>` }; };
    const showSol = () => { const s = solBlock(); fb.insertAdjacentHTML('beforeend', s.html); typeset(fb); texInto($('#' + s.id, el), ansTex(S.cur), true); };
    const lockUI = () => { S.locked = true; input.disabled = true; chk.disabled = false; chk.textContent = 'Continuar'; chk.classList.remove('bad'); };
    const shake = () => { fld.classList.add('bad'); setTimeout(() => fld.classList.remove('bad'), 800); };
    const tally = (firstTry) => { const p = S.per[S.curTopic] || (S.per[S.curTopic] = { n: 0, first: 0 }); p.n++; if (firstTry) p.first++; S.resolved++; setBar(); };

    function check() {
      const r = E.check(ex, input.value);
      if (r.err || r.empty) { fb.innerHTML = `<div class="fb bad"><b>Revisa cómo lo has escrito</b>${esc(r.msg)}</div>`; shake(); return; }
      if (r.ok) {
        const firstTry = S.att === 0; S.correct++; S.xp += firstTry ? 10 : 5; if (firstTry) S.first++; tally(firstTry); lockUI(); fld.classList.add('good');
        fb.innerHTML = `<div class="fb ok"><b>${pick(['Correcto', 'Muy bien', 'Perfecto', 'Así se hace'])}</b>${r.approx ? (ex.geo ? 'Valor aproximado aceptado.' : 'Valor aproximado aceptado. El exacto es $' + E.LATEX(ex.value) + '$.') : ''}<div><button class="btn sec sm hintbtn" id="sv">Ver solución</button></div></div>`;
        typeset(fb); $('#sv', el).onclick = (e) => { e.target.remove(); showSol(); };
        chk.focus({ preventScroll: true }); return;
      }
      S.att++;
      if (S.mode !== 'test' && S.att === 1) {
        fb.innerHTML = `<div class="fb bad"><b>No es correcto</b>${esc(r.msg)}<div><button class="btn sec sm hintbtn" id="hb">Ver pista</button></div></div>`; shake();
        $('#hb', el).onclick = (e) => { e.target.remove(); fb.insertAdjacentHTML('beforeend', `<div class="hint">${rich(ex.hint || 'Revisa el procedimiento paso a paso.').replace(/^<p>|<\/p>$/g, '')}</div>`); typeset(fb); };
        input.focus({ preventScroll: true }); input.select(); return;
      }
      if (S.mode === 'test') S.fail = true;
      else if (S.extras < 4) { S.queue.push({ id: S.curTopic, d: 0.4 + Math.random() * 0.5 }); S.extras++; }
      tally(false); lockUI();
      fb.innerHTML = `<div class="fb bad"><b>Esta vez no</b>${esc(r.msg)} Así se resuelve:</div>`; showSol(); chk.focus({ preventScroll: true });
    }
    function next() { if (S.fail) finish(); else ask(); }
    input.focus({ preventScroll: true });
  }

  /* resultado */
  function bump(id, acc) {
    const n = st().nodes[id] || (st().nodes[id] = {}), first = !n.done;
    n.done = true; n.seen = (n.seen || 0) + 1; n.best = Math.max(n.best || 0, acc);
    if (first) n.box = acc >= 0.8 ? 1 : 0; else if (acc >= 0.8) n.box = Math.min(5, (n.box || 0) + 1); else if (acc < 0.6) n.box = Math.max(0, (n.box || 0) - 1);
    n.due = addDays(today(), INT[n.box || 0]);
  }
  function finish() {
    S.phase = 'done'; barBox.style.visibility = ''; bar.style.width = '100%'; cnt.textContent = '';
    const s = st(), acc = S.first / S.N, idx = T.findIndex((t) => t.id === S.tid);
    let title, sub, icon = I.check, cls = '', accTxt = Math.round(acc * 100) + ' %';
    if (S.mode === 'test') {
      if (!S.fail) {
        for (let i = 0; i <= idx; i++) { if (sOf(i) !== sOf(idx)) continue; const n = s.nodes[T[i].id] || (s.nodes[T[i].id] = {}); if (!n.done) { n.done = true; n.skipped = true; n.box = 1; n.due = addDays(today(), INT[1]); n.best = 1; n.seen = 0; } }
        S.xp += 30; title = '¡Test superado!'; sub = 'Has desbloqueado «' + T[idx].title + '» y todos los temas anteriores.'; accTxt = '5/5';
      } else { title = 'Aún no'; sub = 'Haz la lección para dominar este tema y vuelve a intentarlo cuando quieras.'; icon = I.lock; cls = 'warn'; accTxt = S.correct + '/5'; }
    } else if (S.mode === 'review') {
      Object.keys(S.per).forEach((id) => bump(id, S.per[id].first / S.per[id].n));
      title = 'Repaso terminado'; sub = S.first + ' de ' + S.N + ' a la primera. Volverán a salir cuando toque.';
    } else {
      const was = isDone(idx); bump(S.tid, acc);
      title = S.mode === 'lesson' ? 'Lección completada' : 'Práctica terminada';
      sub = S.first + ' de ' + S.N + ' a la primera.';
      if (!was && nextIdx(idx) >= 0) sub += ' Has desbloqueado «' + T[nextIdx(idx)].title + '».';
      else if (acc < 0.6) sub += ' Lo repasaremos pronto para afianzarlo.';
    }
    if (S.correct > 0) { const k = s.streak; if (k.last !== today()) { k.n = k.last === addDays(today(), -1) ? k.n + 1 : 1; k.last = today(); } }
    s.xp += S.xp; save();
    body.innerHTML = `<div class="done-screen"><div class="big ${cls}">${icon}</div><h2>${esc(title)}</h2><p class="lead">${esc(sub)}</p>
      <div class="stats"><div class="stat"><b>+${S.xp}</b><span>XP</span></div><div class="stat"><b>${accTxt}</b><span>Aciertos a la primera</span></div><div class="stat"><b>${streakNow()}</b><span>${streakNow() === 1 ? 'Día de racha' : 'Días de racha'}</span></div></div></div>`;
    foot.innerHTML = '<button class="btn" id="fin">Continuar</button>';
    $('#fin', el).onclick = close; scroller.scrollTop = 0;
  }

  if (S.phase === 'theory') theory(); else ask();
}

home();
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('.session')) home(); });
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
